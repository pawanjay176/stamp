[package]
name = "stamp-firmware"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.95"

[features]
default = []
device = ["stamp-x4/device", "dep:esp-hal", "dep:esp-backtrace", "dep:esp-println", "dep:esp-bootloader-esp-idf"]

[[bin]]
name = "stamp-firmware"
path = "src/main.rs"
required-features = ["device"]
test = false
bench = false

[dependencies]
stamp-core = { path = "../stamp-core" }
stamp-x4 = { path = "../stamp-x4" }

[target.'cfg(all(target_arch = "riscv32", target_os = "none"))'.dependencies]
esp-hal = { version = "=1.2.0", optional = true, default-features = false, features = ["esp32c3", "rt", "exception-handler", "unstable"] }
esp-backtrace = { version = "=0.20.0", optional = true, default-features = false, features = ["esp32c3", "panic-handler", "println"] }
esp-println = { version = "=0.18.0", optional = true, default-features = false, features = ["esp32c3", "jtag-serial", "critical-section"] }
esp-bootloader-esp-idf = { version = "=0.6.0", optional = true, default-features = false, features = ["esp32c3"] }
nb = "1"

[lints]
workspace = true
