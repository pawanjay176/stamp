[workspace]
members = [
    "crates/stamp-core",
    "crates/stamp-firmware",
    "crates/stamp-x4",
]
default-members = ["crates/stamp-core"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
mem_forget = "deny"
